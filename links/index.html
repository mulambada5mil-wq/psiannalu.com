svg.line { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: -20px; }
.foto {

.foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 52% 30%; transform: scale(1.15); }

.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }

.row-link {

.tile {

.more {

footer { text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 20px; text-wrap: balance; }
footer p { margin: 0; }
footer .crp { letter-spacing: .12em; text-transform: uppercase; }

.aviso {

.aviso.visivel { opacity: 1; }

@media (min-width: 720px) {

@media (prefers-reduced-motion: reduce) { .icon-btn, .row, .more, .aviso { transition: none; } .row:hover, .icon-btn:hover { transform: none; } }

<p class="aviso" id="aviso" role="status"></p>
<script>
// Compartilhar: usa o menu do aparelho e, onde ele não existe (PC), copia o link
const aviso = document.getElementById("aviso");
let temporizador;
function avisar(texto) {
  aviso.textContent = texto;
  aviso.classList.add("visivel");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => aviso.classList.remove("visivel"), 2600);
}
document.addEventListener("click", async (evento) => {
  const botao = evento.target.closest("[data-partilhar]");
  if (!botao) return;
  const { partilhar: url, titulo: title } = botao.dataset;
  try {
    if (navigator.share) return await navigator.share({ title, url });
    await navigator.clipboard.writeText(url);
    avisar("Link copiado");
  } catch (erro) {
    if (erro.name !== "AbortError") avisar("Não foi possível compartilhar. Copie o endereço na barra do navegador.");
  }
});
</script>

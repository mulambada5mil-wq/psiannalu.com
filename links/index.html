<script>
// Compartilhar: usa o menu do aparelho e, onde ele não existe (PC), copia o link
const aviso = document.getElementById("aviso");
let temporizador;
function avisar(texto) {
  aviso.textContent = texto;
  aviso.classList.add("visivel");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => aviso.classList.remove("visivel"), 2600);
}
document.addEventListener("click", async (evento) => {
  const botao = evento.target.closest("[data-partilhar]");
  if (!botao) return;
  const { partilhar: url, titulo: title } = botao.dataset;
  try {
    if (navigator.share) return await navigator.share({ title, url });
    await navigator.clipboard.writeText(url);
    avisar("Link copiado");
  } catch (erro) {
    if (erro.name !== "AbortError") avisar("Não foi possível compartilhar. Copie o endereço na barra do navegador.");
  }
});
</script>
